<!-- 
    File ini adalah struktur halaman utama aplikasi.
    Berisi: dashboard statistik, form + tabel Mahasiswa, form + tabel Kelas.
    Semua elemen di sini akan "dihidupkan" oleh app.js (diisi data, 
    ditambah event klik, dll).
-->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<!-- Favicon: ikon kecil yang tampil di tab browser -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading-spinner" class="spinner-overlay hidden">
    <div class="spinner"></div>
</div>

<div id="toast-container"></div>

<!-- 
    Header/navbar aplikasi: menampilkan logo + judul aplikasi,
    dan tombol toggle dark mode di pojok kanan.
-->
<header class="navbar">
    <div class="navbar-brand">
        <img src="assets/logo.svg" alt="Logo" class="navbar-logo">
        <h1>Student Management System</h1>
    </div>
    <button id="dark-mode-toggle">🌙</button>
</header>

<main class="container">

    <!-- Dashboard statistik: total mahasiswa, total kelas, rata-rata nilai -->
    <section class="dashboard">
        <div class="stat-card">
            <h3 id="stat-mahasiswa">0</h3>
            <p>Total Mahasiswa</p>
        </div>
        <div class="stat-card">
            <h3 id="stat-kelas">0</h3>
            <p>Total Kelas</p>
        </div>
        <div class="stat-card">
            <h3 id="stat-rata-nilai">0</h3>
            <p>Rata-rata Nilai</p>
        </div>
    </section>

    <!-- Form tambah/edit Mahasiswa -->
    <section class="form-section">
        <h2 id="form-title">Tambah Mahasiswa</h2>
        <form id="mahasiswa-form">
            <input type="hidden" id="mahasiswa-id">

            <div class="form-group">
                <label for="nim">NIM *</label>
                <input type="text" id="nim" required>
                <span class="error-text" id="error-nim"></span>
            </div>

            <div class="form-group">
                <label for="nama">Nama *</label>
                <input type="text" id="nama" required>
                <span class="error-text" id="error-nama"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email">
                <span class="error-text" id="error-email"></span>
            </div>

            <div class="form-group">
                <label for="jenis_kelamin">Jenis Kelamin *</label>
                <select id="jenis_kelamin" required>
                    <option value="">-- Pilih --</option>
                    <option value="L">Laki-laki</option>
                    <option value="P">Perempuan</option>
                </select>
            </div>

            <div class="form-group">
                <label for="kelas_id">Kelas</label>
                <select id="kelas_id"></select>
            </div>

            <div class="form-group">
                <label for="foto_mahasiswa">Foto Profil</label>
                 <input type="file" id="foto_mahasiswa" accept="image/*">
            </div>

            <div class="form-actions">
                <button type="submit" id="submit-btn">Simpan</button>
                <button type="button" id="cancel-btn" class="btn-secondary">Batal</button>
            </div>
        </form>
    </section>

    <!-- Tabel daftar Mahasiswa + search -->
    <section class="table-section">
        <h2>Daftar Mahasiswa</h2>
        <!-- 
    Bar pencarian & filter untuk tabel mahasiswa.
    Search: cari berdasarkan nama/NIM (sudah ada sebelumnya).
    Filter: menyaring berdasarkan kelas yang dipilih (fitur baru).
-->
        <div class="search-bar">
    <input type="text" id="search-mahasiswa" placeholder="Cari nama atau NIM...">
    <select id="filter-kelas">
        <option value="">-- Semua Kelas --</option>
    </select>
        </div>
        <!-- Tombol export data mahasiswa (hasil filter/search saat ini) ke CSV -->
            <button id="export-csv-btn" class="btn-export">⬇ Export CSV</button>
        <div class="table-wrapper">
            <table id="mahasiswa-table">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>NIM</th>
                        <th>Nama</th>
                        <th>Email</th>
                        <th>JK</th>
                        <th>Kelas</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="mahasiswa-tbody"></tbody>
            </table>
            <!-- Kontrol pagination untuk tabel mahasiswa -->
            <div class="pagination-controls">
                <button id="prev-page-btn">&laquo; Sebelumnya</button>
                <span id="page-info">Halaman 1</span>
                <button id="next-page-btn">Selanjutnya &raquo;</button> 
            </div>
        </div>
    </section>

    <!-- Form tambah/edit Kelas -->
    <section class="form-section">
        <h2 id="kelas-form-title">Tambah Kelas</h2>
        <form id="kelas-form">
            <input type="hidden" id="kelas-id">

            <div class="form-group">
                <label for="nama_kelas">Nama Kelas *</label>
                <input type="text" id="nama_kelas" required>
                <span class="error-text" id="error-nama_kelas"></span>
            </div>

            <div class="form-group">
                <label for="wali_kelas">Wali Kelas</label>
                <input type="text" id="wali_kelas">
            </div>

            <div class="form-group">
                <label for="foto_kelas">Foto/Logo Kelas</label>
                <input type="file" id="foto_kelas" accept="image/*">
            </div>

            <div class="form-actions">
                <button type="submit" id="kelas-submit-btn">Simpan</button>
                <button type="button" id="kelas-cancel-btn" class="btn-secondary">Batal</button>
            </div>
        </form>
    </section>

    <!-- Tabel daftar Kelas -->
    <section class="table-section">
        <h2>Daftar Kelas</h2>
        <div class="table-wrapper">
            <table id="kelas-table">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nama Kelas</th>
                        <th>Wali Kelas</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="kelas-tbody"></tbody>
            </table>
        </div>
    </section>

    <!-- Form tambah/edit Nilai -->
<section class="form-section">
    <h2 id="nilai-form-title">Tambah Nilai</h2>
    <form id="nilai-form">
        <input type="hidden" id="nilai-id">

        <div class="form-group">
            <label for="nilai_mahasiswa_id">Mahasiswa</label>
            <select id="nilai_mahasiswa_id" required>
                <option value="">-- Pilih Mahasiswa --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mata_kuliah">Mata Kuliah</label>
            <input type="text" id="mata_kuliah" required>
            <span class="error-text" id="error-mata_kuliah"></span>
        </div>

        <div class="form-group">
            <label for="nilai_angka">Nilai</label>
            <input type="number" id="nilai_angka" step="0.01" min="0" max="100" required>
            <span class="error-text" id="error-nilai_angka"></span>
        </div>

        <div class="form-actions">
            <button type="submit" id="nilai-submit-btn">Simpan</button>
            <button type="button" id="nilai-cancel-btn" class="btn-secondary">Batal</button>
        </div>
    </form>
</section>

<!-- Tabel Nilai -->
<section class="table-section">
    <h2>Daftar Nilai</h2>
    <div class="table-wrapper">
        <table id="nilai-table">
            <thead>
                <tr>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Mata Kuliah</th>
                    <th>Nilai</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="nilai-tbody"></tbody>
        </table>
    </div>
</section>

</main>

<script src="js/app.js"></script>
</body>
</html>
